# Regressão: o Eevee tem 8 evoluções e o app mostrava só a primeira.
# Este fluxo falha se a cadeia voltar a ser cortada.
appId: com.efss7.pokedexapp
---
- launchApp:
    clearState: true

- tapOn: 'Buscar por nome ou ID...'
- inputText: 'eevee'
- tapOn: 'Ver detalhes de eevee'

# A seção de evoluções fica abaixo da dobra: precisa rolar até ela.
# Os nomes são comparados em minúsculo porque o card renderiza o valor cru da
# API — o "capitalize" do estilo é só visual e não muda o texto acessível.
- scrollUntilVisible:
    element:
      text: 'vaporeon'
    direction: DOWN

# Vaporeon e Jolteon são dois ramos distintos do MESMO estágio, e caem na
# primeira coluna da grade. Se a cadeia fosse truncada no primeiro caminho,
# só um deles existiria.
- assertVisible: 'vaporeon'
- assertVisible: 'jolteon'
