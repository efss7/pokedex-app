name: Deploy web (GitHub Pages)

# Publica a versão web em https://efss7.github.io/pokedex-app/
# Roda a partir da main, que é o marco de release (a develop segue sendo o
# tronco de desenvolvimento).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela o que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Os mesmos portões do pre-commit. Se o app não passa, não publica.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

      - name: Exportar web
        # As chaves do Supabase vêm dos secrets do repositório: o .env é
        # gitignored e não chega aqui. Sem elas o app publica com login
        # desativado (isSupabaseConfigured vira false), sem erro visível.
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export --platform web

      # O GitHub Pages serve arquivos estáticos e não conhece as rotas do app.
      # Sem um 404.html igual ao index, abrir /pokedex-app/pokemon/25 direto
      # (ou recarregar a página) devolveria 404 em vez de carregar o app.
      - name: Fallback de SPA
        run: cp dist/index.html dist/404.html

      # Impede o Jekyll de ignorar a pasta _expo, onde fica o bundle.
      - name: Desativar Jekyll
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
